name: Deploy HavenTo Python to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            echo "=== Pulling latest code ==="
            cd ~/havento-accomodation-booking-platform
            git pull origin main

            echo "=== Restarting HavenTo service ==="
            sudo systemctl restart havento-api

            echo "=== Checking service status ==="
            sudo systemctl status havento-api --no-pager

            echo "=== Deployment complete! ==="
